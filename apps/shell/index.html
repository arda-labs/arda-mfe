<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arda</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: hsl(0 0% 100%);
        color: hsl(240 10% 3.9%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .arda-boot {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px 16px;
      }
      .arda-boot-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 24px 0;
        text-align: center;
      }
      .arda-boot-mark {
        position: relative;
        display: grid;
        width: 64px;
        height: 64px;
        place-items: center;
      }
      .arda-boot-logo {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 16px;
        background: hsl(240 5.9% 10%);
        color: hsl(0 0% 98%);
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.12);
        font-size: 20px;
        font-weight: 700;
        animation: arda-boot-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .arda-boot-ring,
      .arda-boot-spinner {
        position: absolute;
        inset: 0;
        border-radius: 16px;
        border: 2px solid hsl(240 5.9% 10% / 0.1);
      }
      .arda-boot-spinner {
        border-color: transparent;
        border-top-color: hsl(240 5.9% 10%);
        animation: arda-boot-spin 1s linear infinite;
      }
      .arda-boot-copy {
        display: grid;
        gap: 6px;
      }
      .arda-boot-title {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .arda-boot-text {
        max-width: 320px;
        margin: 0 auto;
        color: hsl(240 3.8% 46.1%);
        font-size: 12px;
        line-height: 1.6;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: hsl(240 10% 3.9%);
          color: hsl(0 0% 98%);
        }
        .arda-boot-logo {
          background: hsl(0 0% 98%);
          color: hsl(240 5.9% 10%);
        }
        .arda-boot-ring {
          border-color: hsl(0 0% 98% / 0.1);
        }
        .arda-boot-spinner {
          border-top-color: hsl(0 0% 98%);
        }
        .arda-boot-text {
          color: hsl(240 5% 64.9%);
        }
      }
      @keyframes arda-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes arda-boot-pulse {
        50% {
          opacity: 0.72;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="arda-boot" role="status" aria-live="polite">
        <div class="arda-boot-content">
          <div class="arda-boot-mark" aria-hidden="true">
            <div class="arda-boot-logo">A</div>
            <div class="arda-boot-ring"></div>
            <div class="arda-boot-spinner"></div>
          </div>
          <div class="arda-boot-copy">
            <p class="arda-boot-title">Arda Secure Session</p>
            <p class="arda-boot-text">Securing workspace...</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
