server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~ ^/mfes/[^/]+/remoteEntry\.js$ {
    add_header Cache-Control "public, max-age=30, s-maxage=30, stale-while-revalidate=60";
    try_files $uri =404;
  }

  location ~* ^/(assets|mfes/.+/assets)/.+\.[a-z0-9_-]+\.(js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /mfes/ {
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
