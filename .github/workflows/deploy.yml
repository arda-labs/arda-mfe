name: deploy

# Production deploy of the shell and the remotes to Cloudflare Workers.
# `plan` compares every unit with the commit it is serving now (its live
# mfe-release.json) and picks the ones whose app, Worker config or shared code
# changed; changed remotes build and deploy in parallel, the shell last.
# Pushes that land while a deploy runs collapse into a single pending run for
# the newest commit; the running deploy is never cancelled halfway.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Deploy every unit, changed or not
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      remotes: ${{ steps.plan.outputs.remotes }}
      shell: ${{ steps.plan.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: plan
        run: bun scripts/plan-cloudflare-deploy.mjs ${{ inputs.all && '--all' || '' }}

  remotes:
    needs: plan
    if: needs.plan.outputs.remotes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.remotes) }}
    name: deploy ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # CI=true makes build-cloudflare-app.mjs read the deployed
      # mfe-release.json from https://arda.io.vn and keep the N-1 chunks.
      - run: bun run cf:build ${{ matrix.app }}
      - run: bunx wrangler deploy --config cloudflare/wrangler.${{ matrix.app }}.jsonc

  # After the remotes, so a new shell never points at a remote build that is
  # not live yet; skipped when any remote failed.
  shell:
    needs: [plan, remotes]
    if: >-
      !cancelled() && needs.plan.outputs.shell == 'true'
      && needs.remotes.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: deploy shell
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run cf:build shell
      - run: bunx wrangler deploy --config cloudflare/wrangler.shell.jsonc
