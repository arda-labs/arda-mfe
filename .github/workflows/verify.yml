name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun pm cache rm
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:packages
      - run: node scripts/check-vuln.test.mjs
      - run: bun run test:federation
      - run: bun run test:features
      - run: git diff --check
      # ADR-005: generated wire types must match arda-be main's OpenAPI
      # documents. A contract change merged in arda-be fails here until
      # `bun run gen:api-types` is run and committed.
      - name: Check out arda-be contracts
        uses: actions/checkout@v4
        with:
          repository: arda-labs/arda-be
          path: .ci/arda-be
          sparse-checkout: contracts/openapi
      - name: Check generated API types
        run: bun run check:api-types
        env:
          ARDA_BE_PATH: .ci/arda-be

  federation-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun pm cache rm
      - run: bun install --frozen-lockfile
      - run: bun run build:apps
      - run: bun run check:bundles
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
